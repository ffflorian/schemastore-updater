name: Weekly Schema Update

permissions: {}

on:
  schedule:
    - cron: '0 5 * * 1' # Every Monday at 05:00 AM UTC
      timezone: 'Europe/Berlin'
  workflow_dispatch:

jobs:
  update-schemas:
    permissions:
      contents: write
      pull-requests: write
    name: Update generated schema packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Update schema packages
        id: update
        continue-on-error: true
        run: yarn update

      - name: Validate generated output
        run: |
          yarn check
          yarn test

      - name: Compose PR body
        if: always()
        run: |
          {
            echo "Weekly automated schema refresh."
            echo ""
            echo "This PR was created by the scheduled workflow after running:"
            echo ""
            echo "- \`yarn update\`"
            echo "- \`yarn check\`"
            echo "- \`yarn test\`"
            if [ -f update-summary.md ]; then
              echo ""
              cat update-summary.md
            fi
          } > pr-body.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          author: Florian Imdahl <git@ffflorian.de>
          committer: Florian Imdahl <git@ffflorian.de>
          base: ${{ github.event.repository.default_branch }}
          branch: chore/weekly-schema-update
          commit-message: 'chore(schemas): weekly schema update'
          title: 'chore(schemas): weekly schema update'
          body-path: pr-body.md

      - name: Fail workflow when publishing failed
        if: steps.update.outcome == 'failure'
        run: exit 1

      - name: Upload update log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: schemagenerator-log
          path: schemagenerator.log
          if-no-files-found: ignore
